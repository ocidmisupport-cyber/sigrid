const taskAttachments = {};
let currentTask = 0;
let currentStep = 0;

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, function(ch) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
  });
}

function fillSelect() {
  const select = document.getElementById('taskSelect');
  select.innerHTML = tasks.map((task, index) => `<option value="${index}">${escapeHTML(task.title)}</option>`).join('');
}

function menuLabel(section) {
  const title = String(section.title || section.label || '').trim();
  const plain = title.replace(/^Stap\s*\d+:\s*/i, '').trim();

  if (/^P\d+\.\d+/i.test(title)) return 'Start';
  if (/onderzoek/i.test(title)) return 'Onderzoek';
  if (/portfolio|bewijs in je portfolio/i.test(title)) return 'Portfolio';

  const rules = [
    [/verzamel.*materiaal|materialen/i, 'Materialen'],
    [/snoer.*voorbereid|bereid.*snoer|snoer voorbereiden/i, 'Snoer klaar'],
    [/stekker|tafeldoos/i, title.includes('tafeldoos') ? 'Tafeldoos' : 'Stekker'],
    [/draden aansluiten|aansluiten/i, 'Aansluiten'],
    [/isoleren/i, 'Isoleren'],
    [/in elkaar|dicht|monteren/i, 'Afmonteren'],
    [/controleer|controleren|test/i, 'Controleren'],
    [/foto/i, 'Foto’s'],
    [/advies|klantvraag/i, 'Advies'],
    [/budget/i, 'Budget'],
    [/onderdelen|componenten/i, 'Onderdelen'],
    [/vergelijk/i, 'Vergelijken'],
    [/excel|overzicht/i, 'Overzicht'],
    [/esd/i, 'ESD'],
    [/werkplek/i, 'Werkplek'],
    [/demonteren/i, 'Demonteren'],
    [/assembleren|montage/i, 'Assembleren'],
    [/installatieprocedure|procedure/i, 'Procedure'],
    [/besturingssysteem|os installeren|windows|linux mint/i, 'OS'],
    [/software.*download|download/i, 'Downloaden'],
    [/software.*installeer|installeer de software|installeren/i, 'Installeren'],
    [/licentie|compatibiliteit/i, 'Check'],
    [/bestandslocaties|mappenlocaties/i, 'Mappen'],
    [/standaardprinter|printer/i, 'Printer'],
    [/schermbeveiliging/i, 'Scherm'],
    [/snelkoppeling/i, 'Snelkoppelingen'],
    [/beveiligingsinstellingen|beveiliging/i, 'Beveiliging'],
    [/virusscanner|back-up|backup/i, 'Virus & backup'],
    [/tekstverwerker|spreadsheet|presentatie/i, 'Office'],
    [/internetbrowser|browser|startpagina/i, 'Browser'],
    [/medestudent/i, 'Controle'],
    [/systeemdocumentatie|documentatie/i, 'Documentatie'],
    [/servicebon/i, 'Servicebon'],
    [/dualboot/i, 'Dualboot']
  ];

  for (const [pattern, shortLabel] of rules) {
    if (pattern.test(plain)) return shortLabel;
  }

  return plain
    .replace(/^Het\s+|^De\s+|^Een\s+/i, '')
    .replace(/\s+van je werk$/i, '')
    .replace(/\s+bij deze opdracht$/i, '')
    .replace(/\s+instellen$/i, '')
    .replace(/\s+maken$/i, '')
    .replace(/\s+toepassen$/i, '')
    .replace(/\s+bijwerken$/i, '')
    .trim()
    .slice(0, 24);
}

function loadTask(index) {
  currentTask = Number(index);
  currentStep = 0;
  const menu = document.getElementById('stepMenu');
  const task = tasks[currentTask];
  menu.innerHTML = task.sections.map((section, index) =>
    `<button class="tab-button ${index === 0 ? 'active' : ''}" onclick="loadStep(${index})">${escapeHTML(menuLabel(section))}</button>`
  ).join('');
  loadStep(0);
}

function fileBaseName(path) {
  return String(path || '').split('/').pop().replace(/-1(?=\.[a-z0-9]+$)/i, '');
}

function findAttachment(line) {
  const task = tasks[currentTask];
  const list = taskAttachments[task.id] || [];
  const raw = String(line || '').trim();
  const simple = raw.toLowerCase();
  return list.find(att => {
    const label = String(att.label || '').trim().toLowerCase();
    const base = fileBaseName(att.href).toLowerCase();
    const realBase = String(att.href || '').split('/').pop().toLowerCase();
    return simple === label || simple === base || simple === realBase;
  });
}

function lineToHTML(line) {
  const attachment = findAttachment(line);
  if (attachment) {
    const label = escapeHTML(attachment.label || fileBaseName(attachment.href));
    const href = encodeURI(attachment.href);
    return `<p><a class="resource-link" href="${href}" target="_blank" rel="noopener">Download ${label}</a></p>`;
  }
  const safe = escapeHTML(line);
  if (safe.startsWith('✔️')) return `<li>${safe.replace('✔️ ', '')}</li>`;
  if (/^\d+\.\s/.test(safe)) return `<p class="info"><strong>${safe}</strong></p>`;
  if (safe === 'Tip:') return `<p class="note"><strong>Tip:</strong></p>`;
  if (safe === 'Bronnenlogboek') return `<p class="note"><strong>${safe}</strong></p>`;
  return `<p>${safe}</p>`;
}


function renderResearchSection(section) {
  return `
    <h2>${escapeHTML(section.title)}</h2>
    <p class="research-intro">Zoek eerst kort uit wat je nodig hebt om deze opdracht veilig en goed uit te voeren. Gebruik je bronnen praktisch: alleen wat je echt nodig hebt voor deze dagtaak.</p>
    <div class="research-grid">
      <div class="research-card"><strong>1. Zoek</strong><span>Gebruik minimaal twee bronnen, bijvoorbeeld een handleiding, website, video of AI.</span></div>
      <div class="research-card"><strong>2. Check</strong><span>Vergelijk de informatie. Klopt het met de opdracht, veiligheid en uitleg van je docent?</span></div>
      <div class="research-card"><strong>3. Noteer</strong><span>Schrijf kort op wat je gebruikt hebt en waarom dat helpt bij je uitvoering.</span></div>
    </div>
    <div class="research-log">
      <strong>Bronnenlogboek</strong><span>Vul dit kort in je portfolio of documentatie in.</span>
      <strong>Bron</strong><span>Website, video, AI, handleiding of docent.</span>
      <strong>Gezocht</strong><span>Bijvoorbeeld: veiligheid, aansluitvolgorde, installatie-instelling of controle.</span>
      <strong>Gebruikt</strong><span>Korte uitleg in je eigen woorden.</span>
    </div>
    <p class="research-tip"><strong>Tip:</strong> AI mag je gebruiken als hulpmiddel, maar controleer belangrijke informatie altijd met een tweede bron of met je docent.</p>
  `;
}

function loadStep(index) {
  currentStep = Number(index);
  document.querySelectorAll('.tab-button').forEach((button, i) => button.classList.toggle('active', i === currentStep));
  const task = tasks[currentTask];
  const section = task.sections[currentStep];
  if (/onderzoek/i.test(section.title || section.label || '')) {
    document.getElementById('contentPanel').innerHTML = renderResearchSection(section);
    return;
  }
  const items = section.items || [];
  let html = `<h2>${escapeHTML(section.title)}</h2>`;
  let listBuffer = [];
  function flushList() {
    if (listBuffer.length) {
      html += `<ul>${listBuffer.join('')}</ul>`;
      listBuffer = [];
    }
  }
  items.forEach(line => {
    if (String(line).startsWith('✔️')) {
      listBuffer.push(lineToHTML(line));
    } else {
      flushList();
      html += lineToHTML(line);
    }
  });
  flushList();
  document.getElementById('contentPanel').innerHTML = html;
}

fillSelect();
loadTask(0);
</script>
</body>
